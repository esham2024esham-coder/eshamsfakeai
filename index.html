<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gold Edition</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root {
            --gold: #D4AF37;
            --light-gold: #F9F295;
            --bg: #FFFFFF;
            --text: #2c2c2c;
            --bot-bubble: #fdfaf0;
        }
        body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { 
            padding: 20px; 
            background: linear-gradient(to right, var(--gold), var(--light-gold), var(--gold));
            text-align: center; 
            color: white; 
            font-size: 1.5rem; 
            font-weight: bold; 
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 15px; border-radius: 15px; max-width: 80%; line-height: 1.6; border: 1px solid transparent; }
        .user { 
            background: var(--gold); 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 2px;
        }
        .bot { 
            background: var(--bot-bubble); 
            border-color: var(--gold); 
            color: var(--text); 
            align-self: flex-start; 
            border-bottom-left-radius: 2px;
        }
        .input-area { 
            padding: 20px; 
            background: #fff; 
            border-top: 2px solid var(--gold); 
            display: flex; 
            gap: 10px; 
        }
        input { 
            flex: 1; 
            padding: 15px; 
            border: 1px solid #ddd; 
            border-radius: 30px; 
            outline: none; 
            font-size: 1rem;
        }
        input:focus { border-color: var(--gold); box-shadow: 0 0 5px var(--gold); }
        button { 
            background: var(--gold); 
            color: white; 
            border: none; 
            padding: 10px 25px; 
            border-radius: 30px; 
            cursor: pointer; 
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background: #b8962e; transform: scale(1.05); }
    </style>
</head>
<body>

<header>AI Luxury Engine</header>
<div id="chat">
    <div class="msg bot">Welcome. This interface is running the Turbo GPT model for maximum accuracy. How may I assist you?</div>
</div>
<div class="input-area">
    <input type="text" id="userInput" placeholder="Ask anything..." onkeypress="if(event.key==='Enter') askAI()">
    <button onclick="askAI()">SEND</button>
</div>

<script>
    async function askAI() {
        const input = document.getElementById('userInput');
        const chat = document.getElementById('chat');
        const text = input.value.trim();
        if (!text) return;

        // Display user text
        chat.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = '';
        
        // Create bot bubble
        const botMsgDiv = document.createElement('div');
        botMsgDiv.className = 'msg bot';
        botMsgDiv.innerText = "Generating response...";
        chat.appendChild(botMsgDiv);
        chat.scrollTop = chat.scrollHeight;

        try {
            // Using GPT-4.1-Mini for high speed + accuracy
            const response = await puter.ai.chat(text, {
                model: 'gpt-4.1-mini', 
                stream: true 
            });

            botMsgDiv.innerText = ""; 

            // Streaming text
            for await (const part of response) {
                const content = part?.text || "";
                botMsgDiv.innerText += content;
                chat.scrollTop = chat.scrollHeight;
            }

        } catch (error) {
            botMsgDiv.innerText = "Error: Site is busy. Please try again.";
            console.error(error);
        }
    }
</script>

</body>
</html>
